[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
optimizer = true
# runs=1 optimizes for code size: EEZ sits near the EIP-170 limit (24,576) and does not fit at runs=200.
optimizer_runs = 1
via_ir = true
# Read access for file-based tools (BlobTools.s.sol), scoped to the DSL examples
# folder — input files (scenario .dsl / blob hex) must live there — and for the
# compiled artifacts the e2e PrepareJob driver instantiates via vm.getCode.
fs_permissions = [{access = "read", path = "./script/blob/examples/"}, {access = "read", path = "./out/"}]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "preserve"

[rpc_endpoints]

[etherscan]
